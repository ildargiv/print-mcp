[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photoshop-print-mcp"
version = "1.0.0"
description = "MCP server for colour-accurate batch printing through Adobe Photoshop: fixed ICC pipeline, sublimation mirror, print profiles"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ildar Gaisin" }]
keywords = ["mcp", "mcp-server", "photoshop", "printing", "icc", "sublimation", "windows"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/ildargiv/print-mcp"
Issues = "https://github.com/ildargiv/print-mcp/issues"

[project.scripts]
photoshop-print-mcp = "print_mcp.server:main"

[tool.setuptools]
packages = ["print_mcp"]
